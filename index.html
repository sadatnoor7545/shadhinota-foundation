<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadhinota Foundation</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    
    <div class="logo-container">
        <img src="logo.png" class="logo-img">
        <span class="logo-text">Shadhinota</span>
    </div>

    <ul class="nav-links">
        <li>Home</li>
        <li>Notifications</li>
        <li>Blog</li>
        <li>Events</li>
    </ul>

    <div class="nav-right">
        <a href="donate.html">
            <button class="join-btn">Join Us</button>
        </a>
    </div>

</nav>

<!-- HERO -->
<section class="hero">
    <div class="hero-content">
        <h1>JUSTICE<br>FOR ALL</h1>
        <p>
            Shadhinota Foundation is dedicated to empowering communities
            and building a society free from poverty, hunger, and injustice.
        </p>
        <a href="donate.html"><button class="btn">Donate Now</button></a>
    </div>

    <div class="hero-image">
        <img src="https://images.unsplash.com/photo-1607746882042-944635dfe10e">
    </div>
</section>

<!-- IMPACT -->
<section class="impact">
    <h2>Our Impact</h2>

    <div class="impact-grid">
        <div class="impact-box">
            <h3>500+</h3>
            <p>People Helped</p>
        </div>

        <div class="impact-box">
            <h3>120+</h3>
            <p>Volunteers</p>
        </div>

        <div class="impact-box">
            <h3>50+</h3>
            <p>Projects</p>
        </div>
    </div>
</section>

</body>
</html>
